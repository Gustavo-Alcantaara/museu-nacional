<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museu Nacional</title>

    <!--Normalize CSS-->
    <link rel="stylesheet" type="text/css" href="./src/css/normalize.css">

    <!--CSS-->
    <link rel="stylesheet" type="text/css" href="./src/css/style.css">

        <!--[if lt IE 9]>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
        <![endif]-->


</head>
<body>
    
    <div id="container"><!-- Início container -->

        <header><!-- Início header -->
            <div id="logo">
                <h1><a href="">Museu Nacional</a></h1>
            </div>

            <nav><!-- Início nav -->
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Exposições</a></li>
                <li><a href="#">Pesquisas</a></li>
                <li><a href="#">Acervo</a></li>
                <li><a href="#">Vídeos</a></li>
                <li><a href="#">Fotos</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav><!-- Fim nav /-->

        </header><!-- Fim header /-->

        <div id="principal"><!-- Início principal -->

            <div id="conteudo">
                <section id="capa">
                    <img src="./src/assets/img/museu.png" alt="Imagem do museu">
                </section>
            </div>

            <aside>
                <section id="depoimento">
                    <img src="./src/assets/img/depoimento.png" alt="Depoimento">
                </section>

                <section id="visita"> <!-- Início visita -->
                    <h4>Faça uma visita</h4>
                    <form action="">
                        <fieldset>
                            <legend>Selecione uma data</legend>

                            <label for="data">data</label>
                            <input class="campo" type="text" id="data" value="dd/mm/aaaa">

                            <label for="qtd">Qtd pessoas</label>
                            <input class="campo" style="width: 30px;" type="text" id="qtd" value="1">
                        </fieldset>

                        <input class="botao" type="submit" value="Verificar disponibilidade">

                    </form>
                </section><!-- Fim visita -->

                <section id="galeria">
                    <h4>Galeria de fotos</h4>

                    <a href="">
                        <img src="./src/assets/img/imagem1.jpg" height="93" width="93" alt="">
                    </a>

                    <a href="">
                        <img src="./src/assets/img/imagem2.jpg" height="93" width="93" alt="">
                    </a>

                    <a href="">
                        <img src="./src/assets/img/imagem3.jpg" height="93" width="93" alt="">
                    </a>

                    <a href="">
                        <img src="./src/assets/img/imagem4.jpg" height="93" width="93" alt="">
                    </a>

                </section>

            </aside>

        </div><!-- Fim principal -->

    </div><!-- Fim container /-->
</body>
</html>
